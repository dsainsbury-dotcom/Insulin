name: Release v2.6.0 Live CGM Intelligence

on:
  push:
    paths:
      - '.github/workflows/release_v260.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch app and docs
        env:
          PATCH_B64: 
        run: |
          python - <<'PY'
          import os,base64,zlib
          exec(zlib.decompress(base64.b64decode(os.environ['PATCH_B64'])).decode())
          PY
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text()
          m=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert m,'inline script missing'
          pathlib.Path('/tmp/app.js').write_text(m[-1])
          PY
          node --check /tmp/app.js
      - name: Commit v2.6.0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md CHANGELOG.md PROJECT_BRAIN.md LIVE_CGM_INTELLIGENCE_v2.6.md
          git commit -m "Release v2.6.0 Live CGM Intelligence"
          git push origin main
