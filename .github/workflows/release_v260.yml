name: Release v2.6.0 Live CGM Intelligence

on:
  push:
    paths:
      - '.github/workflows/release_v260.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch app and docs
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          assert 'v2.5.1' in s
          s=s.replace('<title>ICR Meal Dashboard v2.5.1</title>','<title>ICR Meal Dashboard v2.6.0</title>')
          s=s.replace('<h1>ICR Meal Dashboard <small style="font-size:.48em;color:#0b5cab">v2.5.1</small></h1>','<h1>ICR Meal Dashboard <small style="font-size:.48em;color:#0b5cab">v2.6.0</small></h1>')
          s=s.replace('<div class="badge">v2.5.1 LIVE</div>','<div class="badge">v2.6.0 LIVE</div>')
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>','<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>\n<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>')
          css='.intelligenceGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.intelCard{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.intelCard span{display:block;color:var(--muted);font-size:.72rem}.intelCard strong{display:block;font-size:1.05rem;margin-top:4px}.chartWrap{height:330px}.outcomeGrid,.memoryGrid,.patternGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.outcomeCard,.memoryCard,.patternCard{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.mini{font-size:.74rem;color:var(--muted);line-height:1.45}.bigNow{font-size:2.2rem;font-weight:900;color:var(--green)}.sectionTitle{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.rangeBtns{display:flex;gap:6px;flex-wrap:wrap}.rangeBtn{background:#edf2f7;color:#344054}.rangeBtn.active{background:var(--blue);color:#fff}.intelNote{border-left:4px solid var(--blue);background:var(--softblue);padding:10px 12px;border-radius:10px;font-size:.8rem;line-height:1.45;margin-top:10px}'
          s=s.replace('@media(max-width:800px){','@media(max-width:800px){.intelligenceGrid,.outcomeGrid,.memoryGrid,.patternGrid{grid-template-columns:1fr}.chartWrap{height:270px}',1)
          s=s.replace('</style>',css+'\n</style>')
          nav='<div class="navTabs"><button class="viewBtn active" data-view="tracker">Meal Tracker</button><button class="viewBtn" data-view="progress">CGM Progress</button></div>'
          nav2='<div class="navTabs"><button class="viewBtn active" data-view="tracker">Meal Tracker</button><button class="viewBtn" data-view="intelligence">Live Intelligence</button><button class="viewBtn" data-view="progress">CGM Progress</button></div>'
          assert nav in s
          s=s.replace(nav,nav2,1)
          anchor='</div>\n<div id="progress" class="viewPane">'
          pane=r'''</div>
<div id="intelligence" class="viewPane">
<section class="card"><div class="sectionTitle"><div><h2 style="margin:0">Live CGM Intelligence</h2><div class="sectionNote">Nightscout history is analysed on this device. Refreshing later can reconstruct meal outcomes even if the app was closed after you ate.</div></div><button id="refreshIntelligence" class="primary" type="button">Refresh intelligence</button></div><div id="intelState" class="notice warn">Connect Nightscout in Meal Tracker to unlock live intelligence.</div></section>
<section class="card"><div class="sectionTitle"><div><h2 style="margin:0">Right now</h2><div class="sectionNote">A quick picture of the current CGM situation.</div></div></div><div class="intelligenceGrid" style="margin-top:12px"><div class="intelCard"><span>Current glucose</span><strong id="intelNow">--</strong></div><div class="intelCard"><span>Trend</span><strong id="intelTrend">--</strong></div><div class="intelCard"><span>In-range streak</span><strong id="intelRangeStreak">--</strong></div><div class="intelCard"><span>Last logged meal</span><strong id="intelLastMeal">--</strong></div></div></section>
<section class="card"><div class="sectionTitle"><div><h2 style="margin:0">CGM trend graph</h2><div class="sectionNote">Rolling Nightscout glucose history with meal markers.</div></div><div class="rangeBtns"><button class="rangeBtn" data-hours="3">3h</button><button class="rangeBtn active" data-hours="6">6h</button><button class="rangeBtn" data-hours="12">12h</button><button class="rangeBtn" data-hours="24">24h</button></div></div><div class="chartWrap"><canvas id="cgmChart"></canvas></div></section>
<section class="card"><h2>Automatic meal outcome cards</h2><div class="sectionNote">For recent logged meals with enough Nightscout history, the app calculates the glucose response automatically.</div><div id="outcomeCards" class="outcomeGrid" style="margin-top:12px"></div></section>
<section class="card"><h2>Personal meal memory</h2><div class="sectionNote">Repeated meals are grouped so you can see what your own glucose has tended to do.</div><div id="mealMemory" class="memoryGrid" style="margin-top:12px"></div></section>
<section class="card"><h2>Patterns worth reviewing</h2><div id="patternCards" class="patternGrid"></div><div class="intelNote">These are observations from your logged data, not dosing instructions. Sensor faults, overlapping meals, exercise, alcohol and other confounders can change the picture.</div></section>
<section class="card"><h2>ICR evidence dashboard</h2><div class="intelligenceGrid"><div class="intelCard"><span>Working ICR</span><strong>1:15</strong></div><div class="intelCard"><span>Clean recent 1:15 meals</span><strong id="icrCount">0</strong></div><div class="intelCard"><span>Post-meal low observations</span><strong id="icrLow">0</strong></div><div class="intelCard"><span>Extended >10 observations</span><strong id="icrHigh">0</strong></div></div><div id="icrText" class="intelNote">Waiting for enough matched meal + CGM evidence.</div></section>
<section class="card"><h2>Low / high event view</h2><div class="intelligenceGrid"><div class="intelCard"><span>Readings below 3.9</span><strong id="lowReadings">0</strong></div><div class="intelCard"><span>Readings above 10</span><strong id="highReadings">0</strong></div><div class="intelCard"><span>Longest >10 run</span><strong id="longHigh">0 min</strong></div><div class="intelCard"><span>History analysed</span><strong id="historyHours">0h</strong></div></div></section>
<section class="card"><h2>What the app is learning about me</h2><div id="learnedAboutMe" class="learnGrid"></div></section>
</div>
<div id="progress" class="viewPane">'''
          assert anchor in s
          s=s.replace(anchor,pane,1)
          oldlet="let sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),session=null,cloudRows=[],foodRows=[],foodCloudReady=false,actualEdited=false,scanner=null,currentSmart=null,syncBusy=false,foodFilter='all',latestCgm=null;"
          newlet=oldlet[:-1]+",cgmHistory=[],cgmChart=null,intelligenceOutcomes=[],intelligenceHours=24;"
          assert oldlet in s
          s=s.replace(oldlet,newlet,1)
          insert_after="function forgetNightscoutConfig(){if(!confirm('Forget the Nightscout connection on this device?'))return;localStorage.removeItem(NIGHTSCOUT_URL_KEY);localStorage.removeItem(NIGHTSCOUT_TOKEN_KEY);$('nightscoutUrl').value='';$('nightscoutToken').value='';latestCgm=null;renderLiveCgm()}"
          funcs=r'''
function nearestReading(ts,maxMin=12){if(!cgmHistory.length)return null;let best=null,bestDiff=Infinity;for(const e of cgmHistory){const t=Number(e.date)||Date.parse(e.dateString||'');const d=Math.abs(t-ts);if(d<bestDiff){best=e;bestDiff=d}}return bestDiff<=maxMin*60000?best:null}
function readingMmol(e){return Number(e?.sgv)/18}
async function fetchCgmHistory(hours=24){const cfg=nightscoutConfig();if(!cfg.url||!cfg.token)return false;const count=Math.max(48,Math.ceil(hours*12)+24);const r=await fetch(`${cfg.url}/api/v1/entries.json?count=${count}&token=${encodeURIComponent(cfg.token)}`,{cache:'no-store'});if(!r.ok)throw new Error(`Nightscout HTTP ${r.status}`);const data=await r.json();const cutoff=Date.now()-hours*3600000;cgmHistory=(Array.isArray(data)?data:[]).filter(e=>Number.isFinite(Number(e.sgv))&&(Number(e.date)||Date.parse(e.dateString||''))>=cutoff).sort((a,b)=>(Number(a.date)||0)-(Number(b.date)||0));return cgmHistory.length>0}
function fmtAgo(ts){const m=Math.max(0,Math.round((Date.now()-ts)/60000));if(m<60)return m+' min ago';const h=Math.floor(m/60),mm=m%60;return h+'h '+mm+'m ago'}
function renderRightNow(){const e=cgmHistory.at(-1)||latestCgm;if(!e)return;const mmol=readingMmol(e),trend=mapNightscoutTrend(e.direction)||e.direction||'Unknown';$('intelNow').textContent=Number.isFinite(mmol)?mmol.toFixed(1)+' mmol/L':'--';$('intelTrend').textContent=trend;let streak=0;for(let i=cgmHistory.length-1;i>=0;i--){const v=readingMmol(cgmHistory[i]);if(v>=3.9&&v<=10)streak++;else break}$('intelRangeStreak').textContent=streak?Math.round(streak*5)+' min':'0 min';const meal=mergedMeals()[0];$('intelLastMeal').textContent=meal?`${meal.meal_name||'Meal'} · ${fmtAgo(new Date(meal.timestamp).getTime())}`:'None logged'}
function outcomeForMeal(m){const t=new Date(m.timestamp).getTime(),start=nearestReading(t,12);if(!start)return null;const window=cgmHistory.filter(e=>{const x=Number(e.date)||Date.parse(e.dateString||'');return x>=t-10*60000&&x<=t+6*3600000});if(window.length<4)return null;const vals=window.map(e=>({e,t:Number(e.date)||Date.parse(e.dateString||''),v:readingMmol(e)})).filter(x=>Number.isFinite(x.v));const post=vals.filter(x=>x.t>=t);if(!post.length)return null;const peak=post.reduce((a,b)=>b.v>a.v?b:a,post[0]),sv=readingMmol(start);const near=h=>{const e=nearestReading(t+h*3600000,20);return e?readingMmol(e):null};let above=0,low=false;for(const x of post){if(x.v>10)above+=5;if(x.v<3.9)low=true}const after4=post.filter(x=>x.t>=t+4*3600000),latePeak=after4.length?Math.max(...after4.map(x=>x.v)):null;return{meal:m,start:sv,peak:peak.v,rise:peak.v-sv,peakMin:Math.max(0,Math.round((peak.t-t)/60000)),h2:near(2),h4:near(4),h6:near(6),above10:above,low,lateRise:latePeak!=null&&latePeak>=sv+1&&peak.t>=t+4*3600000}}
function calculateOutcomes(){const oldest=cgmHistory[0]?(Number(cgmHistory[0].date)||Date.parse(cgmHistory[0].dateString||'')):Date.now();intelligenceOutcomes=mergedMeals().filter(m=>new Date(m.timestamp).getTime()>=oldest-15*60000&&new Date(m.timestamp).getTime()<=Date.now()-30*60000).map(outcomeForMeal).filter(Boolean);return intelligenceOutcomes}
function renderOutcomeCards(){const rows=intelligenceOutcomes.slice().sort((a,b)=>new Date(b.meal.timestamp)-new Date(a.meal.timestamp)).slice(0,8);$('outcomeCards').innerHTML=rows.length?rows.map(o=>`<div class="outcomeCard"><strong>${esc(o.meal.meal_name||'Meal')}</strong><div class="mini">${new Date(o.meal.timestamp).toLocaleString()} · ${o.meal.carbs}g carbs · ${o.meal.actual_insulin==null?'-':o.meal.actual_insulin+'U'} · ${esc(o.meal.cgm_trend||'')}</div><div style="margin-top:8px"><b>Start ${o.start.toFixed(1)}</b> · Peak ${o.peak.toFixed(1)} (+${o.rise.toFixed(1)}) · peak ${o.peakMin} min</div><div class="mini">2h ${o.h2==null?'-':o.h2.toFixed(1)} · 4h ${o.h4==null?'-':o.h4.toFixed(1)} · 6h ${o.h6==null?'-':o.h6.toFixed(1)} · >10 about ${o.above10} min · Low seen ${o.low?'Yes':'No'} · Late rise ${o.lateRise?'Yes':'No'}</div></div>`).join(''):'<div class="sectionNote">No recent meals have enough matched CGM history yet.</div>'}
function normMealKey(n){return String(n||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function renderMealMemory(){const groups=new Map();for(const o of intelligenceOutcomes){const k=normMealKey(o.meal.meal_name);if(!k)continue;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(o)}const arr=[...groups.entries()].filter(([,v])=>v.length>=2).sort((a,b)=>b[1].length-a[1].length).slice(0,8);$('mealMemory').innerHTML=arr.length?arr.map(([k,v])=>{const avg=x=>v.reduce((a,o)=>a+x(o),0)/v.length;return`<div class="memoryCard"><strong>${esc(v[0].meal.meal_name)}</strong><div class="mini">${v.length} matched meals</div><div style="margin-top:7px">Average peak rise <b>+${avg(o=>o.rise).toFixed(1)}</b> mmol/L · typical peak ${Math.round(avg(o=>o.peakMin))} min</div><div class="mini">Low observed ${v.filter(o=>o.low).length} time(s) · >10 observed ${v.filter(o=>o.above10>0).length} time(s) · late rise ${v.filter(o=>o.lateRise).length} time(s)</div></div>`}).join(''):'<div class="sectionNote">Meal memory will appear once the same meal has at least two matched CGM outcomes.</div>'}
function avgOf(arr,f){return arr.length?arr.reduce((a,x)=>a+f(x),0)/arr.length:null}
function renderPatterns(){const o=intelligenceOutcomes;if(!o.length){$('patternCards').innerHTML='<div class="sectionNote">Not enough matched meals yet.</div>';return}const cards=[];const byType={};for(const x of o){(byType[x.meal.meal_type]??=[]).push(x)}const typeRows=Object.entries(byType).filter(([,v])=>v.length>=2).map(([k,v])=>[k,avgOf(v,x=>x.rise),v.length]).sort((a,b)=>b[1]-a[1]);if(typeRows[0])cards.push(`<div class="patternCard"><strong>Largest average meal rise</strong><div class="mini">${esc(typeRows[0][0])} · +${typeRows[0][1].toFixed(1)} mmol/L across ${typeRows[0][2]} matched meals</div></div>`);const eve=o.filter(x=>new Date(x.meal.timestamp).getHours()>=20),day=o.filter(x=>new Date(x.meal.timestamp).getHours()<20);if(eve.length>=2&&day.length>=2)cards.push(`<div class="patternCard"><strong>Evening vs earlier meals</strong><div class="mini">Average peak rise after 20:00: +${avgOf(eve,x=>x.rise).toFixed(1)} vs +${avgOf(day,x=>x.rise).toFixed(1)} mmol/L earlier.</div></div>`);const rising=o.filter(x=>String(x.meal.cgm_trend).includes('Rising')||String(x.meal.cgm_trend).includes('rising')),stable=o.filter(x=>String(x.meal.cgm_trend).includes('Stable'));if(rising.length>=2&&stable.length>=2)cards.push(`<div class="patternCard"><strong>Starting trend signal</strong><div class="mini">Rising starts average +${avgOf(rising,x=>x.rise).toFixed(1)} vs stable +${avgOf(stable,x=>x.rise).toFixed(1)} mmol/L.</div></div>`);const late=o.filter(x=>x.lateRise);if(late.length)cards.push(`<div class="patternCard"><strong>Delayed rises</strong><div class="mini">${late.length} recent matched meal(s) showed a rise continuing or reappearing after 4 hours.</div></div>`);$('patternCards').innerHTML=cards.length?cards.join(''):'<div class="sectionNote">No repeated pattern has enough observations yet.</div>'}
function renderIcrEvidence(){const rows=intelligenceOutcomes.filter(o=>Number(o.meal.icr)===15);$('icrCount').textContent=rows.length;$('icrLow').textContent=rows.filter(o=>o.low).length;$('icrHigh').textContent=rows.filter(o=>o.above10>=60).length;let text='Waiting for more matched 1:15 meals.';if(rows.length>=5){const lows=rows.filter(o=>o.low).length,extended=rows.filter(o=>o.above10>=60).length;text=`Across ${rows.length} recent matched 1:15 meals, ${lows} included a CGM reading below 3.9 and ${extended} spent about an hour or more above 10. This is an evidence summary for review, not a recommendation to change the ratio.`}$('icrText').textContent=text}
function renderEvents(){let lo=0,hi=0,long=0,run=0;for(const e of cgmHistory){const v=readingMmol(e);if(v<3.9)lo++;if(v>10){hi++;run+=5;long=Math.max(long,run)}else run=0}$('lowReadings').textContent=lo;$('highReadings').textContent=hi;$('longHigh').textContent=long+' min';$('historyHours').textContent=intelligenceHours+'h'}
function renderLearned(){const items=[];if(intelligenceOutcomes.length>=3){items.push(`<div class="learnItem"><span class="evidence ev-investigate">LIVE EVIDENCE</span><strong>${intelligenceOutcomes.length} recent meals currently have matched Nightscout outcome data.</strong></div>`);const late=intelligenceOutcomes.filter(o=>o.lateRise).length;if(late)items.push(`<div class="learnItem"><span class="evidence ev-investigate">UNDER INVESTIGATION</span><strong>${late} recent matched meal(s) showed a delayed rise after 4 hours.</strong></div>`);const lows=intelligenceOutcomes.filter(o=>o.low).length;items.push(`<div class="learnItem"><span class="evidence ev-rule">SAFETY CHECK</span><strong>${lows} matched meal(s) included a CGM reading below 3.9. Sensor-error context must be checked before treating these as genuine hypos.</strong></div>`)}else items.push('<div class="sectionNote">The app is collecting matched meal + CGM evidence. Repeated findings will appear here as the history grows.</div>');$('learnedAboutMe').innerHTML=items.join('')}
function renderCgmChart(hours=6){if(!window.Chart||!cgmHistory.length)return;const cutoff=Date.now()-hours*3600000,data=cgmHistory.filter(e=>(Number(e.date)||0)>=cutoff);const labels=data.map(e=>new Date(Number(e.date)).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})),glucose=data.map(readingMmol),meals=mergedMeals().filter(m=>new Date(m.timestamp).getTime()>=cutoff).map(m=>{const e=nearestReading(new Date(m.timestamp).getTime(),12);return e?{x:new Date(Number(e.date)).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),y:readingMmol(e),meal:m.meal_name}:null}).filter(Boolean);if(cgmChart)cgmChart.destroy();cgmChart=new Chart($('cgmChart'),{type:'line',data:{labels,datasets:[{label:'Glucose mmol/L',data:glucose,borderWidth:2,pointRadius:0,tension:.2},{label:'Upper range 10',data:labels.map(()=>10),borderDash:[5,5],borderWidth:1,pointRadius:0},{label:'Lower range 3.9',data:labels.map(()=>3.9),borderDash:[5,5],borderWidth:1,pointRadius:0},{type:'scatter',label:'Meals',data:meals,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{y:{suggestedMin:3,suggestedMax:12}},plugins:{tooltip:{callbacks:{afterBody:items=>{const raw=items.find(i=>i.dataset.label==='Meals')?.raw;return raw?.meal?'Meal: '+raw.meal:''}}}}}})}
async function refreshIntelligence(){const cfg=nightscoutConfig();if(!cfg.url||!cfg.token){$('intelState').textContent='Connect Nightscout in Meal Tracker to unlock live intelligence.';$('intelState').className='notice warn';return}try{$('intelState').textContent='Reading Nightscout history and matching meals...';$('intelState').className='notice warn';await fetchCgmHistory(intelligenceHours);latestCgm=cgmHistory.at(-1)||latestCgm;calculateOutcomes();renderRightNow();renderCgmChart(Number(document.querySelector('.rangeBtn.active')?.dataset.hours||6));renderOutcomeCards();renderMealMemory();renderPatterns();renderIcrEvidence();renderEvents();renderLearned();$('intelState').textContent=`Live intelligence updated · ${cgmHistory.length} CGM readings analysed · ${intelligenceOutcomes.length} meal outcomes matched.`;$('intelState').className='notice good'}catch(e){console.error('intelligence',e);$('intelState').textContent='Live intelligence could not refresh. Check Nightscout connection and try again.';$('intelState').className='notice bad'}}
'''
          assert insert_after in s
          s=s.replace(insert_after,insert_after+funcs,1)
          # Tag live source in notes when a fresh Nightscout reading was available at save time.
          old="r.calculated_dose=r.carbs/r.icr;"
          new="if(latestCgm&&readingAgeMinutes(latestCgm)<=10){const t=Number(latestCgm.date)||Date.parse(latestCgm.dateString||'');r.notes+=` | [Live CGM source: Nightscout ${new Date(t).toISOString()} ${latestCgm.sgv}mg/dL ${latestCgm.direction||''}]`}r.calculated_dose=r.carbs/r.icr;"
          assert old in s
          s=s.replace(old,new,1)
          # Refresh intelligence after successful history changes and when opening the tab.
          oldnav="document.querySelectorAll('.viewBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.viewBtn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.viewPane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));window.scrollTo({top:0,behavior:'smooth'})});"
          newnav="document.querySelectorAll('.viewBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.viewBtn').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.viewPane').forEach(x=>x.classList.toggle('active',x.id===b.dataset.view));if(b.dataset.view==='intelligence')refreshIntelligence();window.scrollTo({top:0,behavior:'smooth'})});"
          assert oldnav in s
          s=s.replace(oldnav,newnav,1)
          event_anchor="$('saveNightscout').onclick=saveNightscoutConfig;$('forgetNightscout').onclick=forgetNightscoutConfig;$('refreshLiveCgm').onclick=()=>refreshLiveCgm(true);$('useLiveCgm').onclick=()=>{if(fillFromLive(true))setNotice('Live Nightscout glucose and trend copied into this meal.','good')};"
          event_new=event_anchor+"\n$('refreshIntelligence').onclick=refreshIntelligence;document.querySelectorAll('.rangeBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.rangeBtn').forEach(x=>x.classList.toggle('active',x===b));renderCgmChart(Number(b.dataset.hours))});"
          assert event_anchor in s
          s=s.replace(event_anchor,event_new,1)
          oldinterval="setInterval(syncAll,60000);setInterval(()=>refreshLiveCgm(false),60000);"
          newinterval="setInterval(syncAll,60000);setInterval(()=>refreshLiveCgm(false),60000);setInterval(()=>{if(document.getElementById('intelligence').classList.contains('active'))refreshIntelligence()},300000);"
          assert oldinterval in s
          s=s.replace(oldinterval,newinterval,1)
          vh='<section class="card"><h2>Version history</h2><div class="versionGrid">'
          vnew=vh+'<div class="versionItem"><strong>v2.6.0 - Live CGM Intelligence</strong><ul><li>Added rolling 3h/6h/12h/24h CGM trend graph with meal markers.</li><li>Added Right Now dashboard with current glucose, trend, in-range streak and last logged meal.</li><li>Added automatic retrospective meal outcome cards from Nightscout history: start, peak, rise, peak time, 2h/4h/6h, time above 10, lows and delayed rises.</li><li>Added personal meal memory for repeated meals, pattern detection, ICR evidence summary, low/high event view and a live What the app is learning about me panel.</li><li>Fresh Nightscout source timestamp is tagged into newly saved meal notes for traceability.</li><li>Outcome analysis can be reconstructed when the app is reopened because Nightscout history is fetched retrospectively.</li></ul></div>'
          assert vh in s
          s=s.replace(vh,vnew,1)
          p.write_text(s)

          def append_once(path, marker, text):
              q=Path(path); body=q.read_text() if q.exists() else ''
              if marker not in body:q.write_text(body.rstrip()+'\n\n'+text.strip()+'\n')
          append_once('CHANGELOG.md','## v2.6.0','''## v2.6.0 - 2026-09-05
- Added Live CGM Intelligence dashboard.
- Added rolling Nightscout CGM graph with meal markers.
- Added automatic retrospective meal outcome calculation from Nightscout history.
- Added personal meal memory, repeated-pattern detection, ICR evidence dashboard, low/high event summary and personalised learning panel.
- Added live Nightscout source timestamp tagging to new meal records.
- Analysis remains observational and does not calculate correction insulin or issue autonomous pre-bolus instructions.
''')
          append_once('README.md','### Live CGM Intelligence','''### Live CGM Intelligence
v2.6.0 expands the Nightscout connection into a live personal analytics layer. The app can fetch recent CGM history, plot it, match it to logged meals and reconstruct post-meal outcomes even after the browser was closed. It can summarise repeated meal responses, ICR evidence and low/high event patterns. All derived intelligence is observational and remains subject to sensor/confounder review.
''')
          append_once('PROJECT_BRAIN.md','## v2.6.0 Live CGM Intelligence','''## v2.6.0 Live CGM Intelligence
- Nightscout history is now used for rolling trend visualisation and retrospective meal-response analysis.
- Recent meals can be matched to CGM history for start, peak, peak rise/time, 2h/4h/6h values, approximate time >10, low observations and delayed rises.
- Repeated meals can build a personal meal-memory summary.
- Pattern, ICR and low/high panels are evidence summaries only. They must not silently become dosing recommendations.
- Sensor-fault, overlap, alcohol, exercise and other confounders remain important review exclusions.
- Browser closure does not prevent later outcome reconstruction because Nightscout retains history.
''')
