name: Publish v2.9.7 combined fat and meal memory fix
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.9.7-combined-fix.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python scripts/publish_v297.py
      - name: Check JavaScript syntax
        run: |
          python -c "import re; s=open('index.html').read(); open('/tmp/app.js','w').write(chr(10).join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)))"
          node --check /tmp/app.js
      - name: Verify both fixes
        run: |
          grep -q 'v2.9.7' index.html
          grep -q "function renderMealMemory(outcomes=intelligenceOutcomes)" index.html
          grep -q 'renderMealMemory(intelligenceOutcomes)' index.html
          grep -q 'Meal memory could not be rendered' index.html
          grep -q "\['icr','bolusTiming','target','notes'\].forEach" index.html
          if grep -q "\['fatGrams','fatLevel','icr','bolusTiming','target','notes'\].forEach" index.html; then exit 1; fi
      - name: Commit app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && { echo 'No app changes produced'; exit 1; }
          git commit -m 'Publish v2.9.7 fat fields and meal memory repair'
          git push
