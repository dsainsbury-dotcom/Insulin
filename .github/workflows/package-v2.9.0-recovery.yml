name: Package v2.9.0 recovery
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/package-v2.9.0-recovery.yml
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build recovery folder
        run: |
          mkdir -p recovery
          cp index.html README.md CHANGELOG.md PROJECT_BRAIN.md PROJECT_RULES.md BACKUP_AND_RECOVERY.md CGM_ANALYSIS_PROTOCOL_v1.0.md PREBOLUS_EVIDENCE_PROTOCOL.md recovery/
          cp restaurant_foods_v2.8.6.js recovery/ 2>/dev/null || true
          cp -r reviews recovery/ 2>/dev/null || true
          cp -r beta recovery/ 2>/dev/null || true
          cp -r tools recovery/ 2>/dev/null || true
          printf 'CGM App v2.9.0 recovery package\nProduction release: 13 Sep 2026\nSource: dsainsbury-dotcom/Insulin main\nUI: compact Meal / CGM / Foods / More navigation\nClinical calculation logic preserved from v2.8.7\n' > recovery/RECOVERY_MANIFEST.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CGM_App_v2.9.0_FULL_RECOVERY_2026-09-13_SINGLE_LAYER
          path: recovery/
          retention-days: 90
