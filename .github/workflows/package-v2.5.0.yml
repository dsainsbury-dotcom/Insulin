name: Package v2.5.0 recovery
on:
  push:
    paths:
      - '.github/workflows/package-v2.5.0.yml'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build recovery package
        run: |
          mkdir -p recovery
          rsync -a --exclude='.git' --exclude='recovery' ./ recovery/Insulin-v2.5.0/
      - uses: actions/upload-artifact@v4
        with:
          name: CGM_App_v2.5.0_FULL_RECOVERY_2026-09-04
          path: recovery/Insulin-v2.5.0
          retention-days: 90
