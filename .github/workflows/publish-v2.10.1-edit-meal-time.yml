name: Publish v2.10.1 editable meal time
on:
  push:
    paths:
      - tools/publish_v2_10_1_edit_meal_time_trigger.txt
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/publish_v2_10_1_edit_meal_time.py
      - run: grep -q 'v2.10.1 LIVE' index.html
      - run: grep -q 'Actual meal time (24-hour HH:MM)' index.html
      - run: grep -q 'timestamp:updated.timestamp' index.html
      - name: Commit update
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html
          git diff --cached --check
          git commit -m 'Publish v2.10.1 editable meal time'
          git push
