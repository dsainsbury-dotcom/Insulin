name: Publish v2.9.2 Nightscout history fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.9.2-nightscout-history.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Nightscout history fix
        run: python tools/publish_v2_9_2_nightscout_history.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=['ICR Meal Dashboard v2.9.2','v2.9.2 LIVE','pageSize=500','skip=${skip}','Nightscout history HTTP','intelligenceHours=168']
          missing=[x for x in checks if x not in s]
          assert not missing, f'Missing: {missing}'
          print('v2.9.2 checks passed')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish v2.9.2 Nightscout history fix'
          git push origin main
