name: Publish CGM review 11 Sep 2026
on:
  push:
    paths:
      - tools/publish_cgm_review_2026_09_11_trigger.txt
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/publish_cgm_review_2026_09_11.py
      - run: grep -q 'Latest review - 11 Sep 2026' index.html
      - run: grep -q 'Latest verified review is 11 Sep 2026' PROJECT_BRAIN.md
      - name: Commit review
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html CHANGELOG.md PROJECT_BRAIN.md reviews/CGM_REVIEW_2026-09-11.md
          git diff --cached --check
          git commit -m 'Publish CGM review 11 Sep 2026'
          git push
