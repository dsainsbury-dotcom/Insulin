name: Publish v2.9.6 smart meal memory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2.9.6-smart-meal-memory.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        shell: python
        env:
          MEMORY_B64: ZnVuY3Rpb24gbWVhbEZhbWlseU5hbWUobmFtZSl7CiAgbGV0IHg9U3RyaW5nKG5hbWV8fCcnKS50b0xvd2VyQ2FzZSgpLnRyaW0oKTsKICB4PXgucmVwbGFjZSgvXGJcZCsoPzpcLlxkKyk/XHMqKD86Z3xncmFtfGdyYW1zfGNhcmJ8Y2FyYnN8dXx1bml0fHVuaXRzKVxiL2csJyAnKS5yZXBsYWNlKC9bJitdL2csJyBhbmQgJykucmVwbGFjZSgvW15hLXowLTlc  bj1hdmcoYS5tYXAobz0+bnVtKChvLm1lYWx8fG8ucm93fHxvKS5hY3R1YWxfaW5zdWxpbiA/PyAoby5tZWFsfHxvLnJvd3x8bykuaW5zdWxpbl90YWtlbiA/PyAoby5tZWFsfHxvLnJvd3x8bykuaW5zdWxpbi 
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,base64
          p=Path('index.html'); s=p.read_text()
          s=s.replace('v2.9.4','v2.9.6').replace('v2.9.5','v2.9.6')
          start=s.find('function renderMealMemory(')
          if start < 0: raise SystemExit('renderMealMemory not found')
          nxt=s.find('\nfunction ',start+10)
          if nxt < 0: raise SystemExit('next function not found')
          new=base64.b64decode(os.environ['MEMORY_B64'].replace(' ','')).decode()
          s=s[:start]+new+s[nxt:]
          p.write_text(s)
          PY
      - name: Test patched app
        run: |
          grep -q 'v2.9.6' index.html
          grep -q 'function mealFamilyName' index.html
          grep -q 'Similar meal names are now grouped' index.html
          node --check <(python - <<'PY'
          import re
          s=open('index.html').read()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          print('\n'.join(scripts))
          PY
          )
      - name: Commit app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Publish v2.9.6 smarter personal meal memory'
          git push
