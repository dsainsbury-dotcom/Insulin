name: Publish v2.9.6 smart meal memory
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v2.9.6-smart-meal-memory.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python scripts/publish_v296.py
      - name: Check JavaScript syntax
        run: |
          python -c "import re; s=open('index.html').read(); open('/tmp/app.js','w').write(chr(10).join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)))"
          node --check /tmp/app.js
      - name: Verify release markers
        run: |
          grep -q 'v2.9.6' index.html
          grep -q 'function mealFamilyName' index.html
          grep -q 'Similar meal names are now grouped' index.html
      - name: Commit app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 1
          git commit -m 'Publish v2.9.6 smarter personal meal memory'
          git push
