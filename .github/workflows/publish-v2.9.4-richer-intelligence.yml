name: Publish v2.9.4 richer CGM intelligence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.9.4-richer-intelligence.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade intelligence panels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>ICR Meal Dashboard v2.9.3</title>','<title>ICR Meal Dashboard v2.9.4</title>')
          s=s.replace('v2.9.3</small>','v2.9.4</small>').replace('v2.9.3 LIVE','v2.9.4 LIVE')
          s=s.replace('<h2>Patterns worth reviewing</h2>','<h2>Patterns the app has noticed</h2><div class="sectionNote">Repeated signals from your own matched meals, explained in plain English. These are review clues, not dosing instructions.</div>')
          s=s.replace('<h2>ICR evidence dashboard</h2>','<h2>Is 1:15 working for me?</h2>')
          s=s.replace('<h2>Low / high event view</h2>','<h2>Lows &amp; highs: what happened?</h2><div class="sectionNote">Events are grouped into episodes rather than counting every 5-minute CGM reading.</div>')
          old='</div></section>\n<section class="card"><h2>What the app is learning about me</h2>'
          s=s.replace(old,'</div><div id="eventDetails" class="learnGrid" style="margin-top:12px"></div></section>\n<section class="card"><h2>What the app is learning about me</h2>',1)
          patterns=r'''function renderPatterns(){const o=intelligenceOutcomes;if(!o.length){$('patternCards').innerHTML='<div class="sectionNote">No matched meal outcomes yet. Refresh intelligence after enough CGM follow-up has collected.</div>';return}const cards=[],byType={};for(const x of o){(byType[x.meal.meal_type]??=[]).push(x)}const typeRows=Object.entries(byType).filter(([,v])=>v.length>=2).map(([k,v])=>[k,avgOf(v,x=>x.rise),v.length]).sort((a,b)=>b[1]-a[1]);if(typeRows[0])cards.push(`<div class="patternCard"><strong>${esc(typeRows[0][0])} meals are giving the largest average rise</strong><div class="mini">Across ${typeRows[0][2]} matched meals, the average peak rise was ${typeRows[0][1]>=0?'+':''}${typeRows[0][1].toFixed(1)} mmol/L. This is worth comparing with meal composition, fat, starting glucose and bolus timing before blaming the ICR.</div></div>`);const eve=o.filter(x=>new Date(x.meal.timestamp).getHours()>=20),day=o.filter(x=>new Date(x.meal.timestamp).getHours()<20);if(eve.length>=2&&day.length>=2){const ea=avgOf(eve,x=>x.rise),da=avgOf(day,x=>x.rise),d=ea-da;cards.push(`<div class="patternCard"><strong>Evening meals ${d>0.5?'are rising more than earlier meals':'are not clearly worse than earlier meals'}</strong><div class="mini">After 20:00 the average peak rise is ${ea.toFixed(1)} mmol/L across ${eve.length} meals, versus ${da.toFixed(1)} across ${day.length} earlier meals. ${Math.abs(d)>0.5?'That difference is large enough to keep watching.':'There is not a strong time-of-day difference yet.'}</div></div>`)}const rising=o.filter(x=>String(x.meal.cgm_trend).toLowerCase().includes('rising')),stable=o.filter(x=>String(x.meal.cgm_trend).includes('Stable'));if(rising.length>=2&&stable.length>=2){const ra=avgOf(rising,x=>x.rise),sa=avgOf(stable,x=>x.rise);cards.push(`<div class="patternCard"><strong>Starting while glucose is rising ${ra>sa+0.5?'may matter':'has not shown a clear penalty yet'}</strong><div class="mini">Rising starts averaged a ${ra.toFixed(1)} mmol/L peak rise across ${rising.length} meals, versus ${sa.toFixed(1)} across ${stable.length} stable starts.</div></div>`)}const late=o.filter(x=>x.lateRise);if(late.length)cards.push(`<div class="patternCard"><strong>Delayed rises need separate attention</strong><div class="mini">${late.length} of ${o.length} matched meals showed glucose rising again or continuing to rise after 4 hours. High-fat meals, overlapping food and other context should be checked before treating this as an ICR problem.</div></div>`);$('patternCards').innerHTML=cards.length?cards.join(''):'<div class="sectionNote">There are matched meals, but no repeated pattern is strong enough to describe yet.</div>'}'''
          icr=r'''function renderIcrEvidence(){const rows=intelligenceOutcomes.filter(o=>Number(o.meal.icr)===15),lows=rows.filter(o=>o.low),extended=rows.filter(o=>o.above10>=60),clean=rows.filter(o=>!o.low&&o.above10<60),late=rows.filter(o=>o.lateRise);$('icrCount').textContent=rows.length;$('icrLow').textContent=lows.length;$('icrHigh').textContent=extended.length;let text=`There are ${rows.length} matched meals using 1:15. `;if(rows.length<5)text+='That is still a small evidence set, so no meaningful judgement should be made yet.';else{const pct=Math.round(clean.length/rows.length*100);text+=`${clean.length} (${pct}%) had neither a CGM low nor about an hour or more above 10 mmol/L. ${lows.length} included a reading below 3.9 and ${extended.length} had extended time above 10. ${late.length} showed a delayed rise after 4 hours. `;if(lows.length===0&&extended.length<=Math.max(1,Math.floor(rows.length*.25)))text+='So far the matched evidence broadly supports 1:15 as the working baseline.';else if(lows.length>=Math.max(2,Math.ceil(rows.length*.25)))text+='There are enough low-associated outcomes to review carefully, but sensor faults and other context must be checked before attributing them to 1:15.';else text+='The mixed exceptions need meal-by-meal review before deciding whether the ratio itself is the issue.'}text+=' This is evidence for review, not a recommendation to change insulin.';$('icrText').textContent=text}'''
          events=r'''function renderEvents(){const entries=cgmHistory.map(e=>({t:Number(e.date)||Date.parse(e.dateString||''),v:readingMmol(e)})).filter(x=>Number.isFinite(x.t)&&Number.isFinite(x.v)).sort((a,b)=>a.t-b.t);const episodes=(test)=>{const out=[];let cur=null;for(const x of entries){if(test(x.v)){if(!cur||x.t-cur.end>12*60000){cur={start:x.t,end:x.t,min:x.v,max:x.v,n:1};out.push(cur)}else{cur.end=x.t;cur.min=Math.min(cur.min,x.v);cur.max=Math.max(cur.max,x.v);cur.n++}}else cur=null}return out};const lows=episodes(v=>v<3.9),highs=episodes(v=>v>10);const duration=e=>Math.max(5,Math.round((e.end-e.start)/60000)+5),longHigh=highs.length?Math.max(...highs.map(duration)):0;$('lowReadings').textContent=lows.length+' event'+(lows.length===1?'':'s');$('highReadings').textContent=highs.length+' event'+(highs.length===1?'':'s');$('longHigh').textContent=longHigh+' min';$('historyHours').textContent=intelligenceHours+'h';const nearbyMeal=(e)=>mergedMeals().filter(m=>!isContextEvent(m)).map(m=>({m,t:new Date(m.timestamp).getTime()})).filter(x=>x.t<=e.start&&e.start-x.t<=6*3600000).sort((a,b)=>b.t-a.t)[0]?.m;const cards=[];for(const e of [...lows].sort((a,b)=>b.start-a.start).slice(0,4)){const m=nearbyMeal(e);cards.push(`<div class="learnItem"><strong>Low · ${new Date(e.start).toLocaleString()}</strong><div class="mini">Lowest ${e.min.toFixed(1)} mmol/L · about ${duration(e)} min${m?` · within 6h of ${esc(m.meal_name||'logged meal')} (${m.actual_insulin==null?'-':m.actual_insulin+'U'})`:''}. Check sensor/compression context before treating this as a genuine hypo.</div></div>`)}for(const e of [...highs].sort((a,b)=>b.start-a.start).slice(0,4)){const m=nearbyMeal(e);cards.push(`<div class="learnItem"><strong>High · ${new Date(e.start).toLocaleString()}</strong><div class="mini">Peak ${e.max.toFixed(1)} mmol/L · about ${duration(e)} min above 10${m?` · within 6h of ${esc(m.meal_name||'logged meal')} (${m.actual_insulin==null?'-':m.actual_insulin+'U'})`:''}. Review meal composition, timing and context rather than assuming the ICR caused it.</div></div>`)}$('eventDetails').innerHTML=cards.length?cards.join(''):'<div class="sectionNote">No low or high episodes found in the current history window.</div>'}'''
          s,n1=re.subn(r'function renderPatterns\(\)\{.*?\}\nfunction renderIcrEvidence',patterns+'\nfunction renderIcrEvidence',s,flags=re.S)
          s,n2=re.subn(r'function renderIcrEvidence\(\)\{.*?\}\nfunction renderEvents',icr+'\nfunction renderEvents',s,flags=re.S)
          s,n3=re.subn(r'function renderEvents\(\)\{.*?\}\nfunction renderLearned',events+'\nfunction renderLearned',s,flags=re.S)
          if (n1,n2,n3)!=(1,1,1): raise SystemExit(f'function replacement counts {(n1,n2,n3)}')
          p.write_text(s)
          PY
          grep -q 'v2.9.4 LIVE' index.html
          grep -q 'Patterns the app has noticed' index.html
          grep -q 'Is 1:15 working for me?' index.html
          grep -q 'Lows &amp; highs: what happened?' index.html
          grep -q 'eventDetails' index.html
      - name: Commit v2.9.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Publish v2.9.4 richer CGM intelligence panels'
          git push
