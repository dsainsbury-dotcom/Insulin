name: Package v2.8.0 Recovery
on:
  push:
    paths:
      - '.github/workflows/package-v2.8.0-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify stable v2.8.0 baseline
        run: |
          python tools/finalize_v280_static.py
          grep -q 'ICR Meal Dashboard v2.8.0' index.html
          grep -q 'restaurant_foods_v2.8.0.js' index.html
      - name: Build recovery folder
        run: |
          mkdir -p recovery/testinsulinapp
          cp index.html restaurant_foods_v2.8.0.js restaurant_foods_v2.8.0_verification.json README.md CHANGELOG.md PROJECT_BRAIN.md PROJECT_RULES.md BACKUP_AND_RECOVERY.md CGM_ANALYSIS_PROTOCOL_v1.0.md PREBOLUS_EVIDENCE_PROTOCOL.md SMART_FOOD_SYSTEM_v2.4.md SMART_MEAL_ASSISTANT_v2.4.3.md recovery/
          cp testinsulinapp/index.html recovery/testinsulinapp/index.html
          cp tools/finalize_v280_static.py recovery/finalize_v280_static.py
          [ -f supabase_food_library_v2.4.1.sql ] && cp supabase_food_library_v2.4.1.sql recovery/ || true
          [ -f beta/supabase_schema.sql ] && mkdir -p recovery/beta && cp beta/supabase_schema.sql recovery/beta/ || true
          printf 'CGM App v2.8.0 full recovery package\nProduction commit: %s\nCreated: 2026-09-05\nVerification: restaurant_foods_v2.8.0_verification.json\nStatus: stable baseline\n' "$GITHUB_SHA" > recovery/RECOVERY_VERSION.txt
          cd recovery && zip -r ../CGM_App_v2.8.0_FULL_RECOVERY_2026-09-05.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: CGM_App_v2.8.0_FULL_RECOVERY_2026-09-05
          path: CGM_App_v2.8.0_FULL_RECOVERY_2026-09-05.zip
          if-no-files-found: error
          retention-days: 90
