name: Publish v2.8.7 rounding

on:
  push:
    paths:
      - 'tools/publish_v2_8_7_rounding_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply release changes
        run: python tools/publish_v2_8_7_rounding.py
      - name: Basic release checks
        run: |
          grep -q 'v2.8.7 LIVE' index.html
          grep -q 'Math.round(d)' index.html
          grep -q '0.00-0.49 down and 0.50-0.99 up' index.html
          git diff --check
      - name: Commit release
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add index.html CHANGELOG.md PROJECT_BRAIN.md reviews/CGM_REVIEW_2026-09-11.md
          git diff --cached --quiet && exit 0
          git commit -m 'Release v2.8.7 nearest whole-unit rounding'
          git push origin HEAD:main
