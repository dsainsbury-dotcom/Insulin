name: Publish v2.8.0 final restaurant database
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.8.0-final.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.8.0-full-menus
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pdfplumber
      - run: python tools/build_restaurant_database.py
      - name: Validate final dataset
        run: |
          python - <<'PY'
          import json
          d=json.load(open('restaurant_foods_v2.8.0.json'))
          c=d['counts']
          assert c.get('Greggs',0) >= 80
          assert c.get('PizzaExpress',0) >= 60
          assert c.get('Burger King',0) >= 10
          assert not any(x['restaurant'].lower().startswith('mcdonald') for x in d['items'])
          assert all(all(k in x for k in ('carbs','fat','protein','kcal')) for x in d['items'])
          print('FINAL COUNTS',c,'TOTAL',len(d['items']))
          PY
      - name: Publish to main
        run: |
          cp restaurant_foods_v2.8.0.js /tmp/restaurant_foods_v2.8.0.js
          cp restaurant_foods_v2.8.0.json /tmp/restaurant_foods_v2.8.0.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard
          git clean -fd
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/restaurant_foods_v2.8.0.js restaurant_foods_v2.8.0.js
          cp /tmp/restaurant_foods_v2.8.0.json restaurant_foods_v2.8.0.json
          git add restaurant_foods_v2.8.0.js restaurant_foods_v2.8.0.json
          if git diff --cached --quiet; then
            echo 'Production restaurant database already current.'
          else
            git commit -m 'Publish verified v2.8.0 restaurant database'
            git push origin main
          fi
