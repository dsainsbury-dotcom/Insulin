name: Release v2.4.7 favourite foods
on:
  push:
    paths:
      - '.github/workflows/release-v2.4.7.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply v2.4.7
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          if 'v2.4.7 LIVE' not in s:
              s=s.replace('.fav{background:#fff5cc;color:#7a5700}', '.fav{background:#fff5cc;color:#7a5700}.favQuick{margin-top:12px;border:1px solid #f2d675;background:#fffdf2;border-radius:14px;padding:12px}.favQuickGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:9px}.favQuickItem{border:1px solid #ead98f;background:#fff;border-radius:12px;padding:10px}.favQuickItem strong{display:block}.favQuickItem button{margin-top:8px;width:100%}.filterBtns{display:flex;gap:7px;flex-wrap:wrap}.filterBtn{background:#edf2f7;color:#344054}.filterBtn.active{background:var(--blue);color:#fff}')
              s=s.replace('.smartGrid{grid-template-columns:1fr}.navTabs', '.smartGrid,.favQuickGrid{grid-template-columns:1fr}.navTabs')
              needle='<div id="foodCloudState" class="notice warn">Food library cloud status: checking...</div>'
              s=s.replace(needle,needle+'\n<div id="favouriteQuick" class="favQuick hidden"><div class="reviewHead"><div><strong>Favourite foods</strong><div class="sectionNote">One-tap access to foods you use often.</div></div><span id="favouriteCount" class="pill">0 favourites</span></div><div id="favouriteQuickGrid" class="favQuickGrid"></div></div>',1)
              old='<div style="margin-top:14px"><div class="libraryTools"><div><h3 style="margin:0">My food library</h3><div class="sectionNote">Cloud-backed when signed in. Favourites appear first.</div></div><div><label for="foodSearch">Find saved food</label><input id="foodSearch" placeholder="Search foods or barcode"></div></div>'
              new='<div style="margin-top:14px"><div class="libraryTools"><div><h3 style="margin:0">My food library</h3><div class="sectionNote">Cloud-backed when signed in. Favourites appear first.</div><div class="filterBtns" style="margin-top:8px"><button id="showAllFoods" class="filterBtn active" type="button">All foods</button><button id="showFavouriteFoods" class="filterBtn" type="button">Favourites</button></div></div><div><label for="foodSearch">Find saved food</label><input id="foodSearch" placeholder="Search foods or barcode"></div></div>'
              s=s.replace(old,new,1)
              oldvh='<section class="card"><h2>Version history</h2><div class="versionGrid"><div class="versionItem"><strong>v2.4.6 - delete log entries</strong>'
              newvh='<section class="card"><h2>Version history</h2><div class="versionGrid"><div class="versionItem"><strong>v2.4.7 - favourite foods quick access</strong><ul><li>Added a Favourite foods panel for one-tap reuse of starred foods.</li><li>Added All foods / Favourites filters to the personal food library.</li><li>Favourite status remains cloud-synced across signed-in devices.</li></ul></div><div class="versionItem"><strong>v2.4.6 - delete log entries</strong>'
              s=s.replace(oldvh,newvh,1)
              old='let sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}),session=null,cloudRows=[],foodRows=[],foodCloudReady=false,actualEdited=false,scanner=null,currentSmart=null,syncBusy=false;'
              s=s.replace(old,old[:-1]+",foodFilter='all';",1)
              start=s.index('function renderLibrary(){')
              end=s.index('function smartMode(mode){',start)
              newfun="""function openSavedFood(f){f=normalizeFood(f);smartMode('manual');prepareNutrition({client_id:f.client_id,name:f.name,barcode:f.barcode,brand:f.brand,source:'Personal cloud library',carbs100:f.carbs_100g,fat100:f.fat_100g,protein100:f.protein_100g,kcal100:f.kcal_100g,servingWeight:f.serving_weight_g,portionWeight:f.usual_portion_g});$('portionWeight').value=f.usual_portion_g||'';calcPortion()}\nfunction renderFavouriteQuick(){const base=(foodRows.length?foodRows:read(FOOD_CACHE).map(normalizeFood)).filter(f=>!f.hidden&&f.favourite);$('favouriteCount').textContent=base.length+' favourite'+(base.length===1?'':'s');$('favouriteQuick').classList.toggle('hidden',base.length===0);$('favouriteQuickGrid').innerHTML=base.slice(0,6).map((f,i)=>`<div class=\"favQuickItem\"><strong>★ ${esc(f.name)}</strong><div class=\"foodMeta\">${f.usual_portion_g?'Usual portion '+Number(f.usual_portion_g).toFixed(0)+' g | ':''}Used ${f.use_count||0} time(s)</div><button class=\"primary favQuickUse\" data-i=\"${i}\" type=\"button\">Use</button></div>`).join('');document.querySelectorAll('.favQuickUse').forEach(b=>b.onclick=()=>openSavedFood(base[Number(b.dataset.i)]))}\nfunction renderLibrary(){const term=($('foodSearch')?.value||'').trim().toLowerCase();let list=(foodRows.length?foodRows:read(FOOD_CACHE).map(normalizeFood)).filter(f=>!f.hidden);if(foodFilter==='favourites')list=list.filter(f=>f.favourite);if(term)list=list.filter(f=>(f.name+' '+f.brand+' '+f.barcode).toLowerCase().includes(term));list.sort((a,b)=>(Number(b.favourite)-Number(a.favourite))||(new Date(b.last_used_at||0)-new Date(a.last_used_at||0)));$('showAllFoods')?.classList.toggle('active',foodFilter==='all');$('showFavouriteFoods')?.classList.toggle('active',foodFilter==='favourites');renderFavouriteQuick();if(!list.length){$('foodLibrary').innerHTML='<div class=\"sectionNote\">'+(foodFilter==='favourites'?'No favourite foods yet. Star a saved food to add it here.':'No matching saved foods yet.')+'</div>';return}$('foodLibrary').innerHTML=list.slice(0,30).map((f,i)=>`<div class=\"foodItem\"><div class=\"foodHead\"><div><strong>${f.favourite?'★ ':''}${esc(f.name)}</strong><div class=\"foodMeta\">${esc(f.nutrition_source||'')} ${f.barcode?'| '+esc(f.barcode):''}<br>Used ${f.use_count||0} time(s)${f.usual_portion_g?' | usual portion '+Number(f.usual_portion_g).toFixed(0)+' g':''}</div></div><div class=\"actions\" style=\"margin:0\"><button class=\"${f.favourite?'fav':'secondary'} libFav\" data-i=\"${i}\" type=\"button\">${f.favourite?'★ Favourite':'☆ Favourite'}</button><button class=\"secondary libUse\" data-i=\"${i}\" type=\"button\">Use</button></div></div></div>`).join('');document.querySelectorAll('.libUse').forEach(b=>b.onclick=()=>openSavedFood(list[Number(b.dataset.i)]));document.querySelectorAll('.libFav').forEach(b=>b.onclick=async()=>{await toggleFavourite(list[Number(b.dataset.i)]);renderLibrary()})}\n"""
              s=s[:start]+newfun+s[end:]
              needle="$('foodSearch').addEventListener('input',renderLibrary);"
              s=s.replace(needle,needle+"$('showAllFoods').onclick=()=>{foodFilter='all';renderLibrary()};$('showFavouriteFoods').onclick=()=>{foodFilter='favourites';renderLibrary()};",1)
              s=s.replace('v2.4.6','v2.4.7')
              s=s.replace('<strong>v2.4.7 - delete log entries</strong>','<strong>v2.4.6 - delete log entries</strong>')
              p.write_text(s)
          readme=Path('README.md').read_text()
          if '## Favourite foods v2.4.7' not in readme:
              readme=readme.replace('# ICR Meal Dashboard v2.4.6','# ICR Meal Dashboard v2.4.7',1).replace('- v2.4.6 is the current production version on the repository root.','- v2.4.7 is the current production version on the repository root.',1)
              readme=readme.replace('## Meal log deletion v2.4.6','## Favourite foods v2.4.7\n- Starred foods now appear in a dedicated Favourite foods quick-use panel.\n- Each favourite has a one-tap Use action that opens the saved nutrition and usual portion.\n- The food library now has All foods and Favourites filters.\n- Favourite state continues to sync through Supabase across signed-in devices.\n- Rollback branch: `backup/v2.4.6-pre-v2.4.7`.\n\n## Meal log deletion v2.4.6',1)
              Path('README.md').write_text(readme)
          ch=Path('CHANGELOG.md').read_text()
          if '## v2.4.7' not in ch:
              ch=ch.replace('# Version History\n','# Version History\n\n## v2.4.7 - 31 Aug 2026\n- Added a dedicated Favourite foods quick-use panel.\n- Added one-tap Use actions for starred foods.\n- Added All foods / Favourites filtering in My food library.\n- Favourite state remains cloud-synced across signed-in devices.\n- Created rollback branch `backup/v2.4.6-pre-v2.4.7` before publication.\n',1)
              Path('CHANGELOG.md').write_text(ch)
          brain=Path('PROJECT_BRAIN.md').read_text()
          brain=brain.replace('Current production release: v2.4.6.','Current production release: v2.4.7.')
          if '- Favourite foods quick-use panel' not in brain:
              brain=brain.replace('- Smart Food suggests meal type from food name and actual portion nutrition while keeping the choice editable.','- Smart Food suggests meal type from food name and actual portion nutrition while keeping the choice editable.\n- Favourite foods quick-use panel and All/Favourites library filter provide fast reuse of cloud-synced saved foods.')
          Path('PROJECT_BRAIN.md').write_text(brain)
      - name: Commit release
        run: |
          git config user.name "CGM Release Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html README.md CHANGELOG.md PROJECT_BRAIN.md
          git diff --cached --quiet || git commit -m "Release v2.4.7 favourite foods quick access"
          git push
