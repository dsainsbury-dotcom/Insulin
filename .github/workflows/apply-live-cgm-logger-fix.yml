name: Apply live CGM logger fix
on:
  push:
    branches: [main]
    paths:
      - tools/fix_live_cgm_logger.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply fix
        run: python tools/fix_live_cgm_logger.py
      - name: Verify fix
        run: |
          grep -q "bgManualEdited=false" index.html
          grep -q "refreshLiveCgm(true)" index.html
          grep -q "Burger King UK" index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix live CGM autofill in meal logger"
          git push origin main
