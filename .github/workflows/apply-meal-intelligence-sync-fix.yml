name: Apply meal intelligence sync fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-meal-intelligence-sync-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reliability patch
        run: python tools/fix_meal_intelligence_sync.py
      - name: Verify meal save and intelligence path
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            "cloudRows=[r,...cloudRows.filter",
            "const refreshed=await fetchMeals(),confirmed=refreshed&&cloudRows.some",
            "local safety copy is being kept until cloud refresh confirms it",
            "if(session)await fetchMeals();await fetchCgmHistory(intelligenceHours)",
            "${mergedMeals().length} logged meals visible",
            "function renderCgmChart",
            "const meal=mergedMeals()[0]"
          ]
          missing=[x for x in checks if x not in s]
          assert not missing, f'Missing invariants: {missing}'
          print('meal intelligence reliability checks passed')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix logged meal visibility in Live Intelligence'
          git push origin main
