name: Release v2.8.5 favourite rename and context notes
on:
  push:
    branches: [main]
    paths:
      - tools/release_v2_8_5_favourite_rename.py
      - tools/release_v2_8_5_trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v2.8.5 update
        run: python tools/release_v2_8_5_favourite_rename.py
      - name: Verify
        run: |
          grep -q "v2.8.5 LIVE" index.html
          grep -q "async function renameFavourite" index.html
          grep -q "favQuickRename" index.html
          grep -q "libRename" index.html
          grep -q "Quick context note" index.html
          grep -q "function isContextEvent" index.html
          grep -q "async function saveContextEvent" index.html
          grep -q "event_type" index.html
          grep -q "# v2.8.5 - Favourite rename + quick context notes" CHANGELOG.md
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
              f.write(inline); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Publish through contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          for path in ['index.html','CHANGELOG.md','PROJECT_BRAIN.md']:
              url=f'https://api.github.com/repos/{repo}/contents/{path}'
              req=urllib.request.Request(url,headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req) as r: current=json.load(r)
              payload=json.dumps({'message':'Release v2.8.5 favourite rename and context notes','content':base64.b64encode(pathlib.Path(path).read_bytes()).decode(),'sha':current['sha'],'branch':'main'}).encode()
              req=urllib.request.Request(url,data=payload,method='PUT',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req) as r: print(path, json.load(r)['commit']['sha'])
          PY
