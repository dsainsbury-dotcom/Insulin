name: Release v2.8.5 favourite rename and context notes
on:
  push:
    branches: [main]
    paths:
      - tools/release_v2_8_5_favourite_rename.py
      - tools/release_v2_8_5_trigger.txt
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply v2.8.5 update
        run: python tools/release_v2_8_5_favourite_rename.py
      - name: Verify
        run: |
          grep -q "v2.8.5 LIVE" index.html
          grep -q "async function renameFavourite" index.html
          grep -q "favQuickRename" index.html
          grep -q "libRename" index.html
          grep -q "Quick context note" index.html
          grep -q "function isContextEvent" index.html
          grep -q "async function saveContextEvent" index.html
          grep -q "event_type" index.html
          grep -q "# v2.8.5 - Favourite rename + quick context notes" CHANGELOG.md
          python - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('index.html').read_text()
          scripts=re.findall(r'<script(?: [^>]*)?>(.*?)</script>',s,re.S)
          inline='\n'.join(x for x in scripts if x.strip())
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
              f.write(inline); name=f.name
          subprocess.run(['node','--check',name],check=True)
          PY
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html CHANGELOG.md PROJECT_BRAIN.md
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Release v2.8.5 favourite rename and context notes"
          git push origin main
