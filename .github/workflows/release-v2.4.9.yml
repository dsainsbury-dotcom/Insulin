name: Release v2.4.9 2 Sep CGM review
on:
  push:
    paths:
      - '.github/workflows/release-v2.4.9.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update app and project docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<title>ICR Meal Dashboard v2.4.8</title>','<title>ICR Meal Dashboard v2.4.9</title>')
          s=s.replace('>v2.4.8</small></h1>','>v2.4.9</small></h1>',1)
          s=s.replace('<div class="badge">v2.4.8 LIVE</div>','<div class="badge">v2.4.9 LIVE</div>',1)

          progress='''<section class="card"><h2>My CGM progress</h2><div class="progressGrid"><div class="snapshot"><strong>Latest review - 2 Sep 2026</strong><div class="signalGrid" style="margin-top:10px"><div class="signal"><span>Time in range</span><strong>85%</strong></div><div class="signal"><span>Average glucose</span><strong>7.7</strong></div><div class="signal"><span>GMI</span><strong>6.6%</strong></div><div class="signal"><span>CV</span><strong>28.8%</strong></div></div><div class="reassure"><strong>Coach summary:</strong> control remains strong but this upload is a little weaker than 29 Aug: TIR 88% to 85%, average glucose 7.5 to 7.7, GMI 6.5% to 6.6% and CV 27.1% to 28.8%. All headline AGP goals remain achieved. <strong>ICR verdict:</strong> 1:15 is still the best-supported working baseline. There is no current post-meal low signal saying it is too strong, and this review does not support winding back to 1:20 or strengthening it yet.</div></div><div><div class="learning good"><strong>What is working</strong><br>TIR is 85%, GMI 6.6% and CV 28.8%, all comfortably inside the Dexcom/AGP goals. Dexcom shows 0% low and 0% very low from 12:00 through midnight across this review period.</div><div class="learning watch"><strong>What to watch</strong><br>The weaker area is later in the day. High time reaches 22% at 21:00-22:00 and 27% at 22:00-23:00. High-fat/high-carb and closely spaced meals remain more plausible drivers than a simple global ICR failure.</div><div class="learning info"><strong>Data quality</strong><br>The 27 Aug overnight low period remains a documented faulty-sensor exception. Some 1 Sep app and Dexcom insulin entries do not match perfectly, so those meals are excluded from clean ratio-setting evidence.</div></div></div></section>'''
          s=re.sub(r'<section class="card"><h2>My CGM progress</h2>.*?</section>\n<section class="card"><h2>Clinical goals</h2>',progress+'\n<section class="card"><h2>Clinical goals</h2>',s,count=1,flags=re.S)

          goals='''<section class="card"><h2>Clinical goals</h2><div class="goalGrid"><div class="goalItem"><div><strong>Time in range</strong><div class="goalMeta">Goal &gt;70% | Latest 85%</div></div><span class="tick">ACHIEVED</span></div><div class="goalItem"><div><strong>CV</strong><div class="goalMeta">Goal &lt;36% | Latest 28.8%</div></div><span class="tick">ACHIEVED</span></div><div class="goalItem"><div><strong>GMI</strong><div class="goalMeta">Goal &lt;7% | Latest 6.6%</div></div><span class="tick">ACHIEVED</span></div></div></section>'''
          s=re.sub(r'<section class="card"><h2>Clinical goals</h2>.*?</section>\n<section class="card"><h2>What I\'ve learned about Darren\'s diabetes</h2>',goals+'\n<section class="card"><h2>What I\'ve learned about Darren\'s diabetes</h2>',s,count=1,flags=re.S)

          learned='''<section class="card"><h2>What I've learned about Darren's diabetes</h2><div class="learnGrid"><div class="learnItem"><span class="evidence ev-proven">PROVEN REPEATEDLY</span><strong>Time in range has stayed well above the 70% goal across recent reviews.</strong></div><div class="learnItem"><span class="evidence ev-likely">LIKELY</span><strong>1:15 remains the best-supported working ICR. This review shows no clear post-meal low pattern suggesting it is too strong.</strong></div><div class="learnItem"><span class="evidence ev-likely">LIKELY</span><strong>High-fat/high-carb and closely spaced evening eating are more likely to produce delayed or extended rises.</strong></div><div class="learnItem"><span class="evidence ev-investigate">UNDER INVESTIGATION</span><strong>Bread and other rapid starch meals may have their own response pattern, but the current evidence is not clean enough to justify changing the global ICR.</strong></div><div class="learnItem"><span class="evidence ev-rule">ANALYSIS RULE</span><strong>Small-carb meals rounded up to a whole insulin unit can be effectively much stronger than 1:15 and must be monitored separately rather than used to judge the global ratio.</strong></div><div class="learnItem"><span class="evidence ev-rule">ANALYSIS RULE</span><strong>Overlapping meals, unmatched Dexcom doses, documented sensor faults and unclear nutrition are excluded from clean ICR evidence.</strong></div></div></section>'''
          s=re.sub(r'<section class="card"><h2>What I\'ve learned about Darren\'s diabetes</h2>.*?</section>\n<section class="card"><h2>Review timeline - last 5 uploads</h2>',learned+'\n<section class="card"><h2>Review timeline - last 5 uploads</h2>',s,count=1,flags=re.S)

          timeline='''<section class="card"><h2>Review timeline - last 5 uploads</h2><div class="timeline"><div class="review"><div class="reviewDate">2 Sep 2026</div><div class="reviewMetrics"><span class="chip">TIR 85%</span><span class="chip">Avg 7.7</span><span class="chip">GMI 6.6%</span><span class="chip">CV 28.8%</span></div></div><div class="review"><div class="reviewDate">29 Aug 2026</div><div class="reviewMetrics"><span class="chip">TIR 88%</span><span class="chip">Avg 7.5</span><span class="chip">GMI 6.5%</span><span class="chip">CV 27.1%</span></div></div><div class="review"><div class="reviewDate">28 Aug 2026</div><div class="reviewMetrics"><span class="chip">TIR 88%</span><span class="chip">Avg 7.4</span><span class="chip">GMI 6.5%</span><span class="chip">CV 27.8%</span></div></div><div class="review"><div class="reviewDate">22 Aug 2026</div><div class="reviewMetrics"><span class="chip">TIR 87%</span><span class="chip">Avg 7.5</span><span class="chip">GMI 6.6%</span></div></div><div class="review"><div class="reviewDate">10 Aug 2026</div><div class="reviewMetrics"><span class="chip">TIR 87%</span><span class="chip">Avg 7.4</span><span class="chip">GMI 6.5%</span></div></div></div></section>'''
          s=re.sub(r'<section class="card"><h2>Review timeline - last 5 uploads</h2>.*?</section>\n<section class="card"><h2>3-file review protocol</h2>',timeline+'\n<section class="card"><h2>3-file review protocol</h2>',s,count=1,flags=re.S)

          marker='<section class="card"><h2>Version history</h2><div class="versionGrid">'
          v='''<div class="versionItem"><strong>v2.4.9 - 2 Sep CGM review</strong><ul><li>Processed the complete three-file review through 2 Sep 2026.</li><li>Updated CGM Progress to TIR 85%, average 7.7 mmol/L, GMI 6.6% and CV 28.8%.</li><li>Retained 1:15 as the working ICR: no clear post-meal low signal supports winding back to 1:20, and current confounded highs do not justify strengthening it.</li><li>Added explicit monitoring of whole-unit round-up on small-carb meals and later-evening highs.</li></ul></div>'''
          if marker not in s: raise SystemExit('version marker not found')
          s=s.replace(marker,marker+v,1)
          p.write_text(s)

          readme=Path('README.md')
          r=readme.read_text()
          r=re.sub(r'^# ICR Meal Dashboard v[^\n]+','# ICR Meal Dashboard v2.4.9',r,count=1)
          note='''\n## v2.4.9 review update - 2 Sep 2026\n- Latest 14-day Dexcom metrics: TIR 85%, average 7.7 mmol/L, GMI 6.6%, CV 28.8%.\n- 1:15 remains the working ICR. Current data does not show a clear post-meal low signal that would support winding back to 1:20, and does not yet justify a stronger global ratio.\n- Evening/high-fat/overlapping meals remain the main watch area.\n- Full evidence record: `reviews/CGM_REVIEW_2026-09-02.md`.\n'''
          if '## v2.4.9 review update - 2 Sep 2026' not in r:
              r=r.split('\n',1)[0]+'\n'+note+'\n'+r.split('\n',1)[1]
          readme.write_text(r)

          ch=Path('CHANGELOG.md')
          c=ch.read_text()
          block='''\n## v2.4.9 - 2 Sep 2026\n- Processed the complete Dexcom PDF + raw CSV + app CSV review for 20 Aug-2 Sep.\n- Updated CGM Progress: TIR 85%, average glucose 7.7 mmol/L, GMI 6.6%, CV 28.8%.\n- All headline AGP goals remain achieved.\n- ICR verdict remains 1:15 as the working baseline. No clear post-meal low signal supports winding back to 1:20; current evening highs are too confounded to justify strengthening the global ratio.\n- Added whole-unit round-up on small-carb meals as a specific safety-monitoring rule.\n- Added review record `reviews/CGM_REVIEW_2026-09-02.md`.\n- Created rollback branch `backup/v2.4.8-pre-v2.4.9`.\n'''
          if '## v2.4.9 - 2 Sep 2026' not in c:
              c=c.replace('# Version History\n','# Version History\n'+block+'\n',1)
          ch.write_text(c)

          brain=Path('PROJECT_BRAIN.md')
          b=brain.read_text()
          b=re.sub(r'- Current production release: v[^.]+\.[^.]+\.[^\.\n]+\.', '- Current production release: v2.4.9.', b, count=1)
          b=re.sub(r'Latest verified review is [^\n]+', 'Latest verified review is 2 Sep 2026 for 20 Aug-2 Sep 2026: TIR 85%, average glucose 7.7 mmol/L, GMI 6.6%, CV 28.8%, very high 1%.', b, count=1)
          old='The current clean meal evidence supports 1:15 as the working baseline. Any insulin-setting change remains a discussion point for the diabetes team rather than an automatic app decision.'
          new='The current evidence still supports 1:15 as the working baseline. The 2 Sep review shows no clear post-meal low signal supporting a move back to 1:20, while evening/high-fat and overlapping-meal highs are too confounded to justify strengthening the global ratio. Any insulin-setting change remains a discussion point for the diabetes team rather than an automatic app decision.'
          b=b.replace(old,new)
          brain.write_text(b)
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          js=s.split('<script>')[-1].rsplit('</script>',1)[0]
          Path('/tmp/app.js').write_text(js)
          PY
          node --check /tmp/app.js
      - name: Commit release
        run: |
          git config user.name "dsainsbury-dotcom"
          git config user.email "dsainsbury@gmail.com"
          git add index.html README.md CHANGELOG.md PROJECT_BRAIN.md reviews/CGM_REVIEW_2026-09-02.md
          git commit -m "Release v2.4.9 - 2 Sep CGM review" || exit 0
          git push
