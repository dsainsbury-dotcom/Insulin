name: Fetch Subway Sep 2026 nutrition
on:
  push:
    branches: [tmp/fetch-subway-sep2026]
    paths:
      - .github/workflows/fetch-subway-sep2026.yml
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        run: |
          curl -L --fail --retry 3 'https://media.subway.com/dam/urn:aaid:aem:c9e92cc1-b7a5-493f-adcd-7acb0641eeba/original/as/UKIBuildsandIngredientsNutritionalInformationSeptember2.pdf' -o subway_sep2026.pdf
          pdftotext -layout subway_sep2026.pdf subway_sep2026.txt
          head -100 subway_sep2026.txt
      - uses: actions/upload-artifact@v4
        with:
          name: subway-sep2026-source
          path: |
            subway_sep2026.pdf
            subway_sep2026.txt
