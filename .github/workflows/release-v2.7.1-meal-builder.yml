name: Release v2.7.1 Restaurant Meal Builder
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-v2.7.1-meal-builder.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build v2.7.1
        run: python tools/release_v271.py
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          open('/tmp/app.js','w').write(js)
          PY
          node --check /tmp/app.js
      - name: Commit release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html CHANGELOG.md
          git commit -m "Release v2.7.1 restaurant meal builder"
          git push