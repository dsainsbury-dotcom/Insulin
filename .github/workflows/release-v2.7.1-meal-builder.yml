name: Release v2.7.1 Restaurant Meal Builder
on:
  push:
    paths:
      - '.github/workflows/release-v2.7.1-meal-builder.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build meal basket
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('v2.7.0','v2.7.1')
          s=s.replace('.restaurantClose{white-space:nowrap}', '.restaurantClose{white-space:nowrap}.restaurantBasket{margin-top:12px;border:1px solid #b7e1cf;background:#f2fbf7;border-radius:14px;padding:12px}.basketRow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #dcefe6}.basketRow:last-child{border-bottom:0}.basketTotals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.basketActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.restaurantUse{width:100%;margin-top:10px}')
          old='<div id="restaurantCats" class="restaurantCats"></div><div id="restaurantResults" class="restaurantResults"></div><div class="restaurantDisclaimer">'
          new='<div id="restaurantCats" class="restaurantCats"></div><div id="restaurantBasket" class="restaurantBasket hidden"><div class="reviewHead"><div><strong>Meal basket</strong><div id="basketSummary" class="sectionNote">Build the whole meal, then calculate insulin once.</div></div><span id="basketCount" class="pill">0 items</span></div><div id="basketItems"></div><div id="basketTotals" class="basketTotals"></div><div class="basketActions"><button id="useRestaurantBasket" class="primary" type="button">Use combined meal</button><button id="clearRestaurantBasket" class="secondary" type="button">Clear basket</button></div><div class="sectionNote">Carbohydrates are added together first. Your normal meal-dose calculation and whole-unit rounding are then applied once to the combined total.</div></div><div id="restaurantResults" class="restaurantResults"></div><div class="restaurantDisclaimer">'
          if old not in s: raise SystemExit('restaurant panel marker missing')
          s=s.replace(old,new)
          s=s.replace("let restaurantSelected='Greggs',restaurantCategory='All';", "let restaurantSelected='Greggs',restaurantCategory='All',restaurantBasket=[];")
          start=s.index('function renderRestaurantResults()')
          end=s.index('function smartMode(mode)', start)
          repl='''function renderRestaurantResults(){const term=($('restaurantSearch')?.value||'').trim().toLowerCase();let list=restaurantFoods().filter(x=>x.restaurant===restaurantSelected&&(restaurantCategory==='All'||x.category===restaurantCategory));if(term)list=list.filter(x=>(x.name+' '+x.category).toLowerCase().includes(term));$('restaurantResults').innerHTML=list.map((x,i)=>`<div class="restaurantItem"><div class="restaurantItemHead"><div><div class="restaurantBrand">${esc(x.restaurant)} · ${esc(x.category)}</div><strong>${esc(x.name)}</strong><div class="foodMeta">${esc(x.portion)}</div></div><span class="pill">${x.evidence==='official'?'OFFICIAL':'CHECKED'}</span></div><div class="restaurantMacros"><div class="restaurantMacro"><span>Carbs</span><strong>${Number(x.carbs).toFixed(x.carbs%1?1:0)}g</strong></div><div class="restaurantMacro"><span>Fat</span><strong>${Number(x.fat).toFixed(x.fat%1?1:0)}g</strong></div><div class="restaurantMacro"><span>Protein</span><strong>${Number(x.protein).toFixed(x.protein%1?1:0)}g</strong></div><div class="restaurantMacro"><span>kcal</span><strong>${Number(x.kcal).toFixed(0)}</strong></div></div><div class="restaurantSource">${esc(x.source)} · source ${esc(x.sourceDate)}</div><button class="primary restaurantUse" data-i="${i}" type="button">Add to meal</button></div>`).join('')||'<div class="sectionNote">No matching menu items yet.</div>';document.querySelectorAll('.restaurantUse').forEach(b=>b.onclick=()=>addRestaurantFood(list[Number(b.dataset.i)]))}
function addRestaurantFood(x){if(!x)return;const found=restaurantBasket.find(b=>b.item.restaurant===x.restaurant&&b.item.name===x.name);if(found)found.qty++;else restaurantBasket.push({item:x,qty:1});renderRestaurantBasket();setNotice(`${x.name} added to meal basket.`,'good')}
function restaurantBasketTotals(){return restaurantBasket.reduce((a,b)=>{a.carbs+=Number(b.item.carbs||0)*b.qty;a.fat+=Number(b.item.fat||0)*b.qty;a.protein+=Number(b.item.protein||0)*b.qty;a.kcal+=Number(b.item.kcal||0)*b.qty;a.count+=b.qty;return a},{carbs:0,fat:0,protein:0,kcal:0,count:0})}
function renderRestaurantBasket(){const box=$('restaurantBasket'),items=$('basketItems'),tot=$('basketTotals'),t=restaurantBasketTotals();box.classList.toggle('hidden',!restaurantBasket.length);$('basketCount').textContent=t.count+' item'+(t.count===1?'':'s');$('basketSummary').textContent=restaurantBasket.length?'One combined meal. Insulin rounding happens once after all items are added.':'Build the whole meal, then calculate insulin once.';items.innerHTML=restaurantBasket.map((b,i)=>`<div class="basketRow"><div><strong>${b.qty} × ${esc(b.item.name)}</strong><div class="foodMeta">${esc(b.item.restaurant)} · ${(Number(b.item.carbs)*b.qty).toFixed(1)}g carbs</div></div><div class="actions" style="margin:0"><button class="secondary basketMinus" data-i="${i}" type="button">−</button><button class="secondary basketPlus" data-i="${i}" type="button">+</button><button class="danger basketRemove" data-i="${i}" type="button">Remove</button></div></div>`).join('');tot.innerHTML=`<div class="restaurantMacro"><span>Carbs</span><strong>${t.carbs.toFixed(1)}g</strong></div><div class="restaurantMacro"><span>Fat</span><strong>${t.fat.toFixed(1)}g</strong></div><div class="restaurantMacro"><span>Protein</span><strong>${t.protein.toFixed(1)}g</strong></div><div class="restaurantMacro"><span>kcal</span><strong>${t.kcal.toFixed(0)}</strong></div>`;document.querySelectorAll('.basketMinus').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.i);restaurantBasket[i].qty--;if(restaurantBasket[i].qty<=0)restaurantBasket.splice(i,1);renderRestaurantBasket()});document.querySelectorAll('.basketPlus').forEach(b=>b.onclick=()=>{restaurantBasket[Number(b.dataset.i)].qty++;renderRestaurantBasket()});document.querySelectorAll('.basketRemove').forEach(b=>b.onclick=()=>{restaurantBasket.splice(Number(b.dataset.i),1);renderRestaurantBasket()})}
function clearRestaurantBasket(){restaurantBasket=[];renderRestaurantBasket()}
function useRestaurantBasket(){if(!restaurantBasket.length)return;const t=restaurantBasketTotals(),brands=[...new Set(restaurantBasket.map(b=>b.item.restaurant))],parts=restaurantBasket.map(b=>(b.qty>1?b.qty+'x ':'')+b.item.name);$('mealName').value=`${brands.join(' + ')} - ${parts.join(' + ')}`;$('carbs').value=Number(t.carbs.toFixed(1));$('fatGrams').value=Number(t.fat.toFixed(1));$('mealType').value=inferMealType(parts.join(' '),t.carbs,t.fat);syncFat();actualEdited=false;updateDose();const tags=restaurantBasket.map(b=>`${b.qty}x ${b.item.name} [${b.item.source}; ${b.item.sourceDate}; ${b.item.portion}]`);const existing=$('notes').value.trim(),tag=`Restaurant meal basket: ${tags.join(' + ')}`;$('notes').value=existing?`${existing} | ${tag}`:tag;$('restaurantPanel').classList.add('hidden');clearRestaurantBasket();$('mealForm').closest('section')?.scrollIntoView({behavior:'smooth',block:'start'});setNotice(`Combined restaurant meal: ${t.carbs.toFixed(1)}g carbs. Meal dose is now calculated once from the combined carbohydrate total.`,'good')}
'''
          s=s[:start]+repl+s[end:]
          hook="$('restaurantSearch').addEventListener('input',renderRestaurantResults);"
          s=s.replace(hook, hook+"$('useRestaurantBasket').onclick=useRestaurantBasket;$('clearRestaurantBasket').onclick=clearRestaurantBasket;")
          p.write_text(s)
          c=Path('CHANGELOG.md')
          oldc=c.read_text()
          c.write_text("# v2.7.1 - Restaurant Meal Builder\n- Added a restaurant meal basket so multiple menu items can be combined into one meal.\n- Restaurant item buttons now add to the basket instead of immediately replacing the meal.\n- Added quantity controls, remove, clear, running carbs/fat/protein/kcal totals, and a combined meal action.\n- The app sums carbohydrate first and then runs the existing ICR calculation and whole-unit rounding once on the full meal total.\n- Combined restaurant components and nutrition provenance are retained in meal notes for later CGM review.\n- No change to ICR, correction-dose logic, Nightscout, or CGM intelligence.\n\n"+oldc)
      - name: JavaScript syntax check
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          js=re.findall(r'<script>(.*?)</script>',s,re.S)[-1]
          open('/tmp/app.js','w').write(js)
          PY
          node --check /tmp/app.js
      - name: Commit release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html CHANGELOG.md
          git commit -m "Release v2.7.1 restaurant meal builder"
          git push