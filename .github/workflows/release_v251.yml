name: Release v2.5.1 Nightscout Live CGM

on:
  push:
    paths:
      - '.github/workflows/release_v251.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch release files
        run: python scripts/release_v251.py
      - name: JavaScript syntax check
        run: |
          python -c "import re,pathlib; s=pathlib.Path('index.html').read_text(); m=re.findall(r'<script>(.*?)</script>',s,re.S); assert m; pathlib.Path('/tmp/app.js').write_text(m[-1])"
          node --check /tmp/app.js
      - name: Commit release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md CHANGELOG.md PROJECT_BRAIN.md NIGHTSCOUT_LIVE_CGM.md
          git commit -m 'Release v2.5.1 live Nightscout CGM'
          git push origin main
