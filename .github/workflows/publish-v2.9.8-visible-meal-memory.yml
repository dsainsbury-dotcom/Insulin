name: Publish v2.9.8 visible meal memory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v2.9.8-visible-meal-memory.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python scripts/publish_v298.py
      - name: Check JavaScript syntax
        run: |
          python -c "import re; s=open('index.html').read(); open('/tmp/app.js','w').write(chr(10).join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)))"
          node --check /tmp/app.js
      - name: Verify meal memory cannot be blank or hidden
        run: |
          grep -q 'v2.9.8' index.html
          grep -q 'Meal memory is waiting for Live Intelligence' index.html
          grep -q "label==='Personal meal memory'" index.html
          grep -q 'Live pipeline:' index.html
          grep -q 'function renderMealMemory(outcomes=intelligenceOutcomes)' index.html
      - name: Commit app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && { echo 'No app changes produced'; exit 1; }
          git commit -m 'Publish v2.9.8 visible Personal Meal Memory'
          git push
