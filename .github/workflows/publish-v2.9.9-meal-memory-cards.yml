name: Publish v2.9.9 useful meal memory cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2.9.9-meal-memory-cards.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app
        run: python scripts/publish_v299.py
      - name: JavaScript syntax check
        run: |
          python -c "import re; s=open('index.html').read(); open('/tmp/app.js','w').write(chr(10).join(re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',s,re.S)))"
          node --check /tmp/app.js
      - name: Verify meal memory UX
        run: |
          grep -q 'v2.9.9' index.html
          grep -q 'Every matched meal is shown now' index.html
          grep -q 'Early evidence only' index.html
          grep -q 'Your response:' index.html
          grep -q 'Typical peak' index.html
      - name: Commit app
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && { echo 'No app changes produced'; exit 1; }
          git commit -m 'Publish v2.9.9 useful Personal Meal Memory cards'
          git push
