name: Package v2.6.2 Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-v2.6.2-recovery.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build recovery zip
        run: |
          zip -r CGM_App_v2.6.2_FULL_RECOVERY_2026-09-05.zip index.html README.md CHANGELOG.md PROJECT_BRAIN.md PROJECT_RULES.md BACKUP_AND_RECOVERY.md CGM_ANALYSIS_PROTOCOL_v1.0.md PREBOLUS_EVIDENCE_PROTOCOL.md SMART_FOOD_SYSTEM_v2.4.md SMART_MEAL_ASSISTANT_v2.4.3.md supabase_food_library_v2.4.1.sql beta reviews -x '*.git*'
      - uses: actions/upload-artifact@v4
        with:
          name: CGM_App_v2.6.2_FULL_RECOVERY_2026-09-05
          path: CGM_App_v2.6.2_FULL_RECOVERY_2026-09-05.zip
