name: Fix v2.7.0 Restaurant Data
on:
  push:
    branches:
      - release/v2.7.0-restaurant-foods
    paths:
      - .github/workflows/fix-v2.7.0-restaurant-data.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.7.0-restaurant-foods
      - name: Correct meal type
        run: sed -i "s/name:'Hot Honey Dough Balls',portion:'1 portion',carbs:78.6,fat:7.1,protein:9.8,kcal:415,mealType:'Very high-carb (100g+)'/name:'Hot Honey Dough Balls',portion:'1 portion',carbs:78.6,fat:7.1,protein:9.8,kcal:415,mealType:'Snack'/" restaurant_foods_v2.7.0.js
      - name: Check data JavaScript
        run: node --check restaurant_foods_v2.7.0.js
      - name: Commit correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restaurant_foods_v2.7.0.js
          git commit -m 'Correct Hot Honey Dough Balls meal type' || exit 0
          git push origin HEAD:release/v2.7.0-restaurant-foods
