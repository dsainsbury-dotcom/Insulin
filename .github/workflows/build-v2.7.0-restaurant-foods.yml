name: Build v2.7.0 Restaurant Foods
on:
  push:
    branches:
      - release/v2.7.0-restaurant-foods
    paths:
      - .github/workflows/build-v2.7.0-restaurant-foods.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.7.0-restaurant-foods
      - name: Build interface and docs
        run: python3 tools/build_v270.py
      - name: Check JavaScript
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html').read()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          open('/tmp/app-inline.js','w').write('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/app-inline.js
          node --check restaurant_foods_v2.7.0.js
      - name: Commit build
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html restaurant_foods_v2.7.0.js README.md CHANGELOG.md PROJECT_BRAIN.md
          git commit -m 'Build v2.7.0 restaurant foods' || exit 0
          git push origin HEAD:release/v2.7.0-restaurant-foods
