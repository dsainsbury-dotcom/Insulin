name: Publish v2.9.1 intelligence fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.9.1-intelligence-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v2.9.1 patch
        run: python tools/publish_v2_9_1_intelligence_fix.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            'ICR Meal Dashboard v2.9.1',
            'v2.9.1 LIVE',
            'intelligenceOutcomes=[],intelligenceHours=168,',
            "if(target==='intelligence'&&typeof refreshIntelligence==='function')refreshIntelligence()",
            'v2.9.1 - Live Intelligence population fix',
            'function refreshIntelligence()',
            'function renderOutcomeCards()',
            'function renderMealMemory()',
            'function renderPatterns()',
            'function renderIcrEvidence()',
            'function renderLearned()'
          ]
          missing=[x for x in checks if x not in s]
          assert not missing, f'Missing checks: {missing}'
          assert 'intelligenceHours=24,' not in s
          print('v2.9.1 checks passed')
          PY
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release v2.9.1 Live Intelligence population fix'
          git push origin main
